<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
        <title>One Piece Poster</title>
        <link rel="stylesheet" href="style.css">
        <style>
            body {
                background-image: url(../images/onepieceid.jpg);
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
            .op-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                font-family: 'Rye';
            }
            canvas {
                border: 6px solid #1a1a1a;
                box-shadow: 8px 8px 0px #1a1a1a;
                cursor: pointer;
            }
            .controls {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                width: 100%;
                max-width: 400px;
            }
            .controls input[type="text"] {
                width: 100%;
                padding: 10px 14px;
                font-family: 'Rye';
                font-size: 16px;
                border: 3px solid #1a1a1a;
                background: rgba(255,255,255,0.85);
                outline: none;
            }
            .controls label {
                font-size: 14px;
                font-family: font;
                align-self: flex-start;
                margin-bottom: -6px;
            }
        </style>
    </head>
    <body>
        <div class="op-wrapper">
            <h1>WANTED!</h1>
            <canvas id="poster" width="400" height="560"></canvas>
            <div class="controls">
                <label>YOUR NAME</label>
                <input type="text" id="nameInput" placeholder="Monkey D. Luffy" maxlength="24">

                <label>BOUNTY (BERRIES)</label>
                <input type="text" id="bountyInput" placeholder="3,000,000,000" maxlength="20">

                <p class="upload-hint">Click the poster to upload your photo</p>
                <input type="file" id="photInput" accept="image/*" style="display:none";

                <div class="btn-row">
                    <button class="op-btn primary" onclick="drawPoster()">GENERATE</button>
                    <button class="op-btn secondary" onclick="downloadPoster()">DOWNLOAD</button>
                </div>

                <a href="templates.html" class="op-btn primary" style="margin-top: 4px; text-align: center;"><- BACK</a>
            </div>
        </div>
    </body>
</html>
